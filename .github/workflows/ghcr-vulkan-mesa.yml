name: Build and publish to GHCR (vulkan, mesa driver)

on:
  push:
    branches: [main]
    paths:
      - dockerfiles/ubuntu-vulkan-mesa
      - simple-server/**
      - wyoming_whisper_cpp/**
      - start.sh
      - .github/workflows/ghcr-vulkan-mesa.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: version
        run: |
          echo "whisper_cpp=$(grep -oP '^ARG WHISPER_CPP_REF=\K\S+' dockerfiles/ubuntu-vulkan-mesa)" >> "$GITHUB_OUTPUT"
          echo "wrapper=$(cat wyoming_whisper_cpp/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wyoming-whisper-cpp
          tags: |
            type=raw,value=vulkan
            type=raw,value=vulkan-${{ steps.version.outputs.whisper_cpp }}
            type=raw,value=vulkan-${{ steps.version.outputs.wrapper }}-${{ steps.version.outputs.whisper_cpp }}
            type=sha,prefix=vulkan-sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/ubuntu-vulkan-mesa
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
